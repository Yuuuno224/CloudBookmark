name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 注意：这里刻意不加 `cache: npm`。缓存功能要求仓库里有锁文件，
      # 而本仓库故意不提交 package-lock.json（原因见 .gitignore 里的说明：
      # 锁文件里的原生二进制是平台相关的，Windows 上生成的会让 Linux 装不到）。
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: 环境与原生模块检查
        run: |
          echo "::notice title=环境::node $(node -v) / npm $(npm -v)"
          # Vite 8 用 rolldown，PostCSS/Tailwind 用 lightningcss，两者都带
          # 平台相关的原生二进制。装错平台时 vite/vitest 会立刻崩，
          # 所以这里先把话说清楚，免得以后又对着 "MODULE_NOT_FOUND" 猜。
          node --input-type=module -e "await import('rolldown'); console.log('rolldown 可加载')"
          node --input-type=module -e "await import('lightningcss'); console.log('lightningcss 可加载')"

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试与端到端仿真
        run: |
          # 失败时把原因也写成一条 annotation，这样在 Actions 页面之外也能看到
          set +e
          npm test > /tmp/vitest.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            summary=$(tail -c 1800 /tmp/vitest.log | tr '\n' '~' | tr -d '%' | cut -c1-1400)
            echo "::error title=vitest 退出码 $code::$summary"
            cat /tmp/vitest.log
            exit $code
          fi
          tail -c 400 /tmp/vitest.log

      - name: 生产构建
        run: npm run build

      - name: 检查构建产物是否完整
        run: |
          set -e
          for f in dist/manifest.json \
                   dist/service-worker-loader.js \
                   dist/src/ui/popup/index.html \
                   dist/src/ui/options/index.html \
                   dist/icons/icon128.png; do
            test -f "$f" || { echo "缺少构建产物: $f"; exit 1; }
          done
          echo "构建产物完整"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: cloud-bookmark-extension
          path: dist/
          retention-days: 30
