name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: rm -f package-lock.json

      - run: npm install --legacy-peer-deps

      - name: Verify native bindings
        run: |
          test -d node_modules/rolldown || (echo "rolldown missing" && exit 1)
          test -d node_modules/lightningcss || (echo "lightningcss missing" && exit 1)
          echo "Native bindings OK"

      - run: npm run typecheck

      - run: npm run build

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: cloud-bookmark-extension
          path: dist/
          retention-days: 30
