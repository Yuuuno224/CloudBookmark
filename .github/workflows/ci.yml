name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 用 npm install 而不是 npm ci：仓库里的 package-lock.json 是在没有网络
      # 的环境下、由本地 node_modules 生成的，只固定了版本号，缺少 resolved /
      # integrity 字段，npm ci 会因此报错。在有网络的环境跑一次 npm install
      # 就会补全这些字段，之后可以放心换成 npm ci。
      # 详见 docs/06-开发调试指南.md
      - run: npm install --no-audit --no-fund

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试与端到端仿真
        run: npm test

      - name: 生产构建
        run: npm run build

      - name: 检查构建产物是否完整
        run: |
          set -e
          for f in dist/manifest.json \
                   dist/service-worker-loader.js \
                   dist/src/ui/popup/index.html \
                   dist/src/ui/options/index.html \
                   dist/icons/icon128.png; do
            test -f "$f" || { echo "缺少构建产物: $f"; exit 1; }
          done
          echo "构建产物完整"

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: cloud-bookmark-extension
          path: dist/
          retention-days: 30
