name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 同 ci.yml：锁文件目前缺少 resolved/integrity，用 npm install 更稳妥
      - run: npm install --no-audit --no-fund

      - name: 环境信息
        run: |
          echo "node       : $(node -v)"
          echo "vitest bin : $([ -x node_modules/.bin/vitest ] && echo 存在 || echo 缺失)"

      - run: npm run typecheck

      - name: 单元测试
        run: |
          # 失败时把原因也写成一条 annotation，这样在 Actions 页面之外也能看到
          set +e
          npm test > /tmp/vitest.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            summary=$(tail -c 1800 /tmp/vitest.log | tr '\n' '~' | tr -d '%' | cut -c1-1400)
            echo "::error title=vitest 退出码 $code::$summary"
            cat /tmp/vitest.log
            exit $code
          fi
          tail -c 400 /tmp/vitest.log

      - run: npm run build

      - name: 打包
        run: |
          cd dist
          zip -r ../cloud-bookmark-${{ github.ref_name }}.zip .

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: cloud-bookmark-${{ github.ref_name }}.zip
          generate_release_notes: true
