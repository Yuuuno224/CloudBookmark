name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install --no-audit --no-fund

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: 打包
        run: |
          cd dist
          zip -r ../cloud-bookmark-${{ github.ref_name }}.zip .

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: cloud-bookmark-${{ github.ref_name }}.zip
          generate_release_notes: true
